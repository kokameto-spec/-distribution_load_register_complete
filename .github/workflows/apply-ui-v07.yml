name: Apply UI v0.7

on:
  push:
    branches:
      - vehicle-fuel-costs-build
    paths:
      - .github/workflows/apply-ui-v07.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vehicle-fuel-costs-build
          fetch-depth: 0

      - name: Apply requested UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('vehicle_fuel_costs')

          # 1) Global silver/gold theme with raised gold buttons.
          p = root / 'lib/main.dart'
          s = p.read_text(encoding='utf-8')
          old = """    const blue = Color(0xFF0B4A8B);\n    return MaterialApp(\n      debugShowCheckedModeBanner: false,\n      title: 'حساب تكاليف استهلاك السيارات',\n      locale: const Locale('ar'),\n      theme: ThemeData(\n        useMaterial3: true,\n        colorScheme: ColorScheme.fromSeed(seedColor: blue),\n        scaffoldBackgroundColor: const Color(0xFFF5F8FC),\n        appBarTheme: const AppBarTheme(\n          backgroundColor: blue,\n          foregroundColor: Colors.white,\n          centerTitle: true,\n        ),\n        inputDecorationTheme: const InputDecorationTheme(\n          border: OutlineInputBorder(),\n        ),\n      ),"""
          new = """    const silver = Color(0xFFE3E5E8);\n    const silverDark = Color(0xFF8A8F96);\n    const gold = Color(0xFFD4AF37);\n    const goldDark = Color(0xFF8A6A10);\n    return MaterialApp(\n      debugShowCheckedModeBanner: false,\n      title: 'حساب تكاليف استهلاك السيارات',\n      locale: const Locale('ar'),\n      theme: ThemeData(\n        useMaterial3: true,\n        colorScheme: ColorScheme.fromSeed(seedColor: gold, brightness: Brightness.light),\n        scaffoldBackgroundColor: const Color(0xFFF1F2F4),\n        appBarTheme: const AppBarTheme(\n          backgroundColor: silver,\n          foregroundColor: Color(0xFF222222),\n          centerTitle: true,\n          elevation: 7,\n          shadowColor: silverDark,\n          surfaceTintColor: silver,\n        ),\n        tabBarTheme: const TabBarThemeData(\n          labelColor: Color(0xFF2B2B2B),\n          unselectedLabelColor: Color(0xFF5F6368),\n          indicatorColor: gold,\n          dividerColor: silverDark,\n        ),\n        filledButtonTheme: FilledButtonThemeData(\n          style: ButtonStyle(\n            backgroundColor: const WidgetStatePropertyAll(gold),\n            foregroundColor: const WidgetStatePropertyAll(Color(0xFF241C08)),\n            elevation: const WidgetStatePropertyAll(7),\n            shadowColor: const WidgetStatePropertyAll(goldDark),\n            shape: WidgetStatePropertyAll(RoundedRectangleBorder(borderRadius: BorderRadius.circular(14))),\n          ),\n        ),\n        elevatedButtonTheme: ElevatedButtonThemeData(\n          style: ButtonStyle(\n            backgroundColor: const WidgetStatePropertyAll(gold),\n            foregroundColor: const WidgetStatePropertyAll(Color(0xFF241C08)),\n            elevation: const WidgetStatePropertyAll(7),\n            shadowColor: const WidgetStatePropertyAll(goldDark),\n            shape: WidgetStatePropertyAll(RoundedRectangleBorder(borderRadius: BorderRadius.circular(14))),\n          ),\n        ),\n        iconButtonTheme: IconButtonThemeData(\n          style: ButtonStyle(\n            backgroundColor: const WidgetStatePropertyAll(Color(0xFFE8C85B)),\n            foregroundColor: const WidgetStatePropertyAll(Color(0xFF2A230E)),\n            shadowColor: const WidgetStatePropertyAll(goldDark),\n            shape: const WidgetStatePropertyAll(CircleBorder()),\n          ),\n        ),\n        inputDecorationTheme: InputDecorationTheme(\n          filled: true,\n          fillColor: Colors.white.withValues(alpha: .86),\n          border: const OutlineInputBorder(),\n          focusedBorder: const OutlineInputBorder(borderSide: BorderSide(color: gold, width: 2)),\n        ),\n      ),"""
          if old not in s:
              raise SystemExit('main theme block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          # 2) Remove the visible default admin credentials from login page.
          p = root / 'lib/screens/home_screen.dart'
          s = p.read_text(encoding='utf-8')
          hint = """                    const SizedBox(height: 14),\n                    const Text('الحساب الأول للمدير: admin / 2600\\nبعد الدخول يمكن إنشاء حسابات السائقين وربطها بالسيارات.', textAlign: TextAlign.center, style: TextStyle(fontSize: 12, color: Colors.black54)),\n"""
          if hint in s:
              s = s.replace(hint, '')
          p.write_text(s, encoding='utf-8')

          # 3) Four manager sections remain visible at all times.
          p = root / 'lib/screens/manager_screen.dart'
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              """          bottom: const TabBar(\n            isScrollable: true,\n            tabs: [""",
              """          bottom: const TabBar(\n            isScrollable: false,\n            labelPadding: EdgeInsets.symmetric(horizontal: 2),\n            labelStyle: TextStyle(fontSize: 10, fontWeight: FontWeight.w700),\n            unselectedLabelStyle: TextStyle(fontSize: 10),\n            tabs: [""",
          )

          # Add vehicle delete action.
          marker = "class _VehiclesAdminState extends State<_VehiclesAdmin> {\n"
          if marker not in s:
              raise SystemExit('vehicle admin marker not found')
          delete_method = """class _VehiclesAdminState extends State<_VehiclesAdmin> {\n  Future<void> _deleteVehicle(Vehicle vehicle) async {\n    final ok = await showDialog<bool>(\n          context: context,\n          builder: (_) => AlertDialog(\n            title: const Text('حذف السيارة'),\n            content: Text('هل تريد حذف السيارة ${vehicle.number}؟ ستظل التقارير القديمة محفوظة.'),\n            actions: [\n              TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('إلغاء')),\n              FilledButton(onPressed: () => Navigator.pop(context, true), child: const Text('حذف')),\n            ],\n          ),\n        ) ??\n        false;\n    if (!ok) return;\n    try {\n      await FirebaseService.instance.deleteVehicle(vehicle.code);\n      if (mounted) {\n        ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم حذف السيارة.')));\n      }\n    } catch (e) {\n      if (mounted) {\n        ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('تعذر حذف السيارة: $e')));\n      }\n    }\n  }\n\n"""
          if 'Future<void> _deleteVehicle(Vehicle vehicle)' not in s:
              s = s.replace(marker, delete_method, 1)

          old_trailing = """                    trailing: IconButton(onPressed: () => _edit(v), icon: const Icon(Icons.edit)),\n"""
          new_trailing = """                    trailing: Row(\n                      mainAxisSize: MainAxisSize.min,\n                      children: [\n                        IconButton(onPressed: () => _edit(v), tooltip: 'تعديل السيارة', icon: const Icon(Icons.edit)),\n                        const SizedBox(width: 6),\n                        IconButton(onPressed: () => _deleteVehicle(v), tooltip: 'حذف السيارة', icon: const Icon(Icons.delete_outline, color: Colors.red)),\n                      ],\n                    ),\n"""
          if old_trailing not in s:
              raise SystemExit('vehicle trailing button not found')
          s = s.replace(old_trailing, new_trailing, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Firebase vehicle delete method.
          p = root / 'lib/services/firebase_service.dart'
          s = p.read_text(encoding='utf-8')
          anchor = """  Stream<List<Vehicle>> vehiclesStream() {\n"""
          method = """  Future<void> deleteVehicle(String code) async {\n    await ensureAnonymousAuth();\n    await _db.collection('vehicles').doc(code).delete();\n  }\n\n"""
          if method not in s:
              if anchor not in s:
                  raise SystemExit('vehiclesStream anchor not found')
              s = s.replace(anchor, method + anchor, 1)
          p.write_text(s, encoding='utf-8')

          # 5) Firestore rule allows deleting vehicles.
          p = root / 'firestore.rules'
          s = p.read_text(encoding='utf-8')
          old_rules = """    match /vehicles/{vehicleCode} {\n      allow read, create, update: if signedIn();\n      allow delete: if false;\n    }"""
          new_rules = """    match /vehicles/{vehicleCode} {\n      allow read, create, update, delete: if signedIn();\n    }"""
          if old_rules not in s:
              raise SystemExit('vehicle firestore rule not found')
          p.write_text(s.replace(old_rules, new_rules), encoding='utf-8')

          # 6) Icon number 2: black car + black pump, gold details, silver body.
          p = root / 'assets/fueling_car.svg'
          p.write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">\n  <defs>\n    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">\n      <stop offset="0" stop-color="#ffffff"/><stop offset="0.38" stop-color="#d9dce0"/><stop offset="0.72" stop-color="#9da2a8"/><stop offset="1" stop-color="#f7f7f7"/>\n    </linearGradient>\n    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">\n      <stop offset="0" stop-color="#fff0a3"/><stop offset="0.35" stop-color="#d4af37"/><stop offset="0.7" stop-color="#9a7211"/><stop offset="1" stop-color="#f4d465"/>\n    </linearGradient>\n    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">\n      <stop offset="0" stop-color="#34363a"/><stop offset="1" stop-color="#090a0c"/>\n    </linearGradient>\n    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".35"/></filter>\n  </defs>\n  <rect x="10" y="10" width="492" height="492" rx="92" fill="url(#silver)" stroke="#7f858b" stroke-width="8"/>\n  <rect x="32" y="32" width="448" height="448" rx="72" fill="none" stroke="url(#gold)" stroke-width="12"/>\n  <g filter="url(#shadow)">\n    <rect x="333" y="116" width="105" height="266" rx="20" fill="url(#black)" stroke="url(#gold)" stroke-width="10"/>\n    <rect x="352" y="142" width="67" height="58" rx="10" fill="#15171a" stroke="#e4bd43" stroke-width="6"/>\n    <rect x="362" y="153" width="47" height="28" rx="5" fill="url(#gold)"/>\n    <path d="M438 172c34 8 42 37 35 72-5 24-20 41-42 41h-12" fill="none" stroke="#17191c" stroke-width="15" stroke-linecap="round"/>\n    <path d="M419 281l30-12 12 30-30 12z" fill="url(#gold)" stroke="#111317" stroke-width="5"/>\n    <path d="M430 300c-43 17-60 42-75 70" fill="none" stroke="#111317" stroke-width="15" stroke-linecap="round"/>\n    <path d="M357 338c-13 17-21 36-27 52" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>\n\n    <path d="M78 316h248l-23-78c-8-27-28-43-57-43H157c-29 0-49 16-57 43L78 316Z" fill="url(#black)" stroke="#111317" stroke-width="8"/>\n    <path d="M115 238c9-23 24-33 47-33h79c23 0 38 10 47 33H115Z" fill="#111317" stroke="url(#gold)" stroke-width="5"/>\n    <path d="M91 318v47c0 18 14 32 32 32h17v-35h126v35h17c18 0 32-14 32-32v-47" fill="url(#black)" stroke="#111317" stroke-width="8"/>\n    <path d="M111 313h63" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>\n    <path d="M232 313h63" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>\n    <circle cx="137" cy="337" r="17" fill="#f4d465" stroke="#7f5c0b" stroke-width="5"/>\n    <circle cx="270" cy="337" r="17" fill="#f4d465" stroke="#7f5c0b" stroke-width="5"/>\n    <path d="M174 360h58" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>\n    <path d="M316 269l28 7" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>\n  </g>\n</svg>\n''', encoding='utf-8')
          PY

      - name: Commit requested changes
        shell: bash
        run: |
          git config user.name "OpenAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add vehicle_fuel_costs
          git commit -m "Apply silver gold UI, icon 2, and vehicle delete"
          git push origin vehicle-fuel-costs-build
