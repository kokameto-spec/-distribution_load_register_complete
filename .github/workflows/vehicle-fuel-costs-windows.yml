name: Build Vehicle Fuel Costs Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - vehicle-fuel-costs-build

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vehicle_fuel_costs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform
        shell: pwsh
        run: |
          if (Test-Path windows) { Remove-Item windows -Recurse -Force }
          if (Test-Path test) { Remove-Item test -Recurse -Force }
          flutter create --platforms=windows --org eg.tahakom26 --project-name vehicle_fuel_costs .
          if (Test-Path test) { Remove-Item test -Recurse -Force }

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows x64
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath vehicle-fuel-costs-windows-x64.zip -Force

      - name: Upload Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-fuel-costs-windows-x64
          path: vehicle_fuel_costs/vehicle-fuel-costs-windows-x64.zip
