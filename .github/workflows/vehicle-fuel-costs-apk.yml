name: Build Vehicle Fuel Costs Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - vehicle-fuel-costs-build

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vehicle_fuel_costs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          rm -rf android test
          flutter create --platforms=android --org eg.tahakom26 --project-name vehicle_fuel_costs .
          rm -rf test

      - name: Generate fueling-car launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 48  -h 48  assets/fueling_car.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72  -h 72  assets/fueling_car.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96  -h 96  assets/fueling_car.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 assets/fueling_car.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 assets/fueling_car.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-fuel-costs-apk
          path: vehicle_fuel_costs/build/app/outputs/flutter-apk/app-release.apk
