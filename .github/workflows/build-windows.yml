name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        shell: powershell
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        shell: powershell
        run: flutter pub get

      - name: Build Windows Release
        shell: powershell
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM="3.5"
          flutter build windows --release

      - name: Verify Windows Release
        shell: powershell
        run: |
          $release = "build\windows\x64\runner\Release"

          if (-not (Test-Path $release)) {
            Write-Error "Windows Release folder not found"
            exit 1
          }

          if (-not (Test-Path "$release\distribution_load_register_final.exe")) {
            Write-Error "EXE file not found"
            exit 1
          }

          Write-Host "EXE found successfully:"
          Write-Host "$release\distribution_load_register_final.exe"

      - name: Create Windows ZIP
        shell: powershell
        run: |
          $release = "build\windows\x64\runner\Release"
          $zip = "$env:GITHUB_WORKSPACE\Distribution_Load_Register_Windows.zip"

          Compress-Archive `
            -Path "$release\*" `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {
            Write-Error "ZIP creation failed"
            exit 1
          }

          Write-Host "ZIP created successfully:"
          Write-Host $zip

      - name: Upload Windows Program
        uses: actions/upload-artifact@v4
        with:
          name: Distribution-Load-Register-Windows
          path: ${{ github.workspace }}/Distribution_Load_Register_Windows.zip
          retention-days: 30
          if-no-files-found: error
