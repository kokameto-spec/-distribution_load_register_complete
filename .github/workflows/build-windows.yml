name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        shell: powershell
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        shell: powershell
        run: flutter pub get

      - name: Build Windows Release
        shell: powershell
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM="3.5"
          flutter build windows --release

      - name: Add Visual C++ Runtime DLLs
        shell: powershell
        run: |
          $release = "build\windows\x64\runner\Release"

          if (-not (Test-Path $release)) {
            Write-Error "Windows Release folder not found"
            exit 1
          }

          $vsRoot = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $redistRoot = Join-Path $vsRoot "VC\Redist\MSVC"

          if (-not (Test-Path $redistRoot)) {
            Write-Error "Visual C++ Redist root not found: $redistRoot"
            exit 1
          }

          Write-Host "Searching for x64 Visual C++ Runtime..."

          $msvcp = Get-ChildItem $redistRoot `
            -Recurse `
            -Filter "msvcp140.dll" `
            -File |
            Where-Object {
              $_.FullName -match '\\x64\\' -and
              $_.FullName -notmatch 'debug'
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $msvcp) {
            Write-Error "Could not find x64 msvcp140.dll"
            exit 1
          }

          $crtFolder = $msvcp.Directory.FullName

          Write-Host "CRT folder found:"
          Write-Host $crtFolder

          Copy-Item "$crtFolder\*.dll" $release -Force

          Write-Host "Visual C++ Runtime DLLs copied successfully"

      - name: Verify Windows Package
        shell: powershell
        run: |
          $release = "build\windows\x64\runner\Release"

          $requiredFiles = @(
            "distribution_load_register_final.exe",
            "flutter_windows.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          foreach ($file in $requiredFiles) {
            $fullPath = Join-Path $release $file

            if (-not (Test-Path $fullPath)) {
              Write-Error "Required file missing: $file"
              exit 1
            }

            Write-Host "OK: $file"
          }

          if (-not (Test-Path "$release\data")) {
            Write-Error "Flutter data folder missing"
            exit 1
          }

          Write-Host "Windows package verification completed successfully"

      - name: Show Release Files
        shell: powershell
        run: |
          Get-ChildItem "build\windows\x64\runner\Release" |
          Select-Object Name, Length

      - name: Upload Windows Program
        uses: actions/upload-artifact@v4
        with:
          name: Distribution-Load-Register-Windows-x64-Portable
          path: build/windows/x64/runner/Release/
          retention-days: 30
          if-no-files-found: error
